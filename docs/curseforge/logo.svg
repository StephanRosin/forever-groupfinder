<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#2a3346"/><stop offset="0.6" stop-color="#151a26"/><stop offset="1" stop-color="#0a0d14"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset="0.35" stop-color="#e8c25a"/><stop offset="0.7" stop-color="#a87a22"/><stop offset="1" stop-color="#6e4c12"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc930" stop-opacity="0"/><stop offset="1" stop-color="#ffc930" stop-opacity="0.22"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/></filter>
    <clipPath id="panel"><rect x="72" y="96" width="368" height="320" rx="14"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- the finder window -->
  <g filter="url(#shadow)">
    <rect x="64" y="88" width="384" height="336" rx="20" fill="url(#gold)"/>
    <rect x="72" y="96" width="368" height="320" rx="14" fill="#0d111a"/>
  </g>
  <g clip-path="url(#panel)">
    <!-- header with the quest-log glow and line -->
    <rect x="72" y="96" width="368" height="58" fill="url(#glow)"/>
    <rect x="72" y="153" width="368" height="3" fill="#c8961f" opacity="0.6"/>
    <!-- magnifying glass in the header -->
    <g stroke-linecap="round" fill="none">
      <circle cx="108" cy="122" r="13" stroke="#ffd35a" stroke-width="6"/>
      <path d="M118 132 L131 145" stroke="#c9a46a" stroke-width="7"/>
    </g>
    <!-- header buttons -->
    <circle cx="398" cy="125" r="11" fill="none" stroke="#9a9aa2" stroke-width="4"/>
    <rect x="356" y="119" width="18" height="14" rx="3" fill="#9a9aa2"/>
    <path d="M359 119 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#9a9aa2" stroke-width="3"/>

    <!-- three role slots: tank, healer, damage -->
    <g stroke="#e8c25a" stroke-width="5">
      <circle cx="160" cy="236" r="48" fill="#1d3a66"/>
      <circle cx="256" cy="236" r="48" fill="#1b4a2c"/>
      <circle cx="352" cy="236" r="48" fill="#5a1d1d"/>
    </g>
    <!-- shield -->
    <path d="M160 204 L186 213 V238 C186 254 175 264 160 270 C145 264 134 254 134 238 V213 Z" fill="#6fb2ff" stroke="#dbeaff" stroke-width="3" stroke-linejoin="round"/>
    <!-- cross -->
    <path d="M247 208 h18 v19 h19 v18 h-19 v19 h-18 v-19 h-19 v-18 h19 Z" fill="#6fe08a" stroke="#e2ffe8" stroke-width="3" stroke-linejoin="round"/>
    <!-- sword -->
    <g transform="translate(352 236) rotate(45)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -36 L7 -24 V10 H-7 V-24 Z" fill="#ff8a7a" stroke="#ffe3de" stroke-width="3"/>
      <path d="M-18 10 H18" stroke="#ffd35a" stroke-width="7"/>
      <path d="M0 10 V30" stroke="#c9a46a" stroke-width="7"/>
    </g>

    <!-- list rows below -->
    <g>
      <rect x="92" y="316" width="328" height="26" rx="4" fill="#1c2333"/>
      <rect x="92" y="352" width="328" height="26" rx="4" fill="#1c2333"/>
      <rect x="104" y="325" width="120" height="8" rx="3" fill="#e8c25a" opacity="0.75"/>
      <rect x="104" y="361" width="90" height="8" rx="3" fill="#e8c25a" opacity="0.75"/>
      <rect x="352" y="325" width="56" height="8" rx="3" fill="#9a9aa2"/>
      <rect x="352" y="361" width="56" height="8" rx="3" fill="#9a9aa2"/>
    </g>
  </g>
</svg>
